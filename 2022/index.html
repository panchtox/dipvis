		<script>
		window.DIPVIS = {
			base: "../",
			diapositivas: true,   // el scroll encaja en el texto, el gráfico y el pie
			periodo: "2022&ndash;2026",
			anios: [2022, 2026],

				"Cuanto m&aacute;s arriba, m&aacute;s cerca de La Libertad Avanza y el PRO; cuanto m&aacute;s abajo, m&aacute;s cerca del peronismo y la izquierda. " +
				"El color dice de qu&eacute; lado del cero queda la l&iacute;nea: siempre del lado de LLA (violeta), siempre del lado opositor (verde azulado) o si cambi&oacute; de lado (&aacute;mbar). " +
				"Un a&ntilde;o cuenta para el lado s&oacute;lo si la posici&oacute;n est&aacute; claramente de un lado (su margen de error no toca el cero); " +
				"los a&ntilde;os en que el diputado vot&oacute; menos de 20 veces (por ejemplo, si presidi&oacute; la C&aacute;mara) no se dibujan. " +
				"Cada a&ntilde;o se ubica a la C&aacute;mara alrededor de su promedio, as&iacute; que cerca de la mitad de los diputados queda del lado de LLA: " +
				"el violeta incluye al PRO y a buena parte de la UCR, y quiere decir que votaron del lado de LLA, no que sean de LLA. " +
				"2026 incluye las votaciones desde que asumi&oacute; la C&aacute;mara nueva, el 10/12/2025. " +
				"Pas&aacute; el cursor por una l&iacute;nea o una provincia para destacarla.",
			datos: "Datos 2022&ndash;2026 &middot; votaciones nominales de la HCDN hasta el 9/9/2026",
			leyenda: { op: "Siempre opositor", va: "Cambi&oacute; de lado", of: "Siempre del lado de LLA" },
			flechas: { "ofi-opo": "&rarr; LLA/PRO", "opo-ofi": "&rarr; peronismo" }
		};

		<script type="text/javascript">
		var dips,ar=Array(),idps=Array();
		var viewportWidth  = document.documentElement.clientWidth
			,viewportHeight = document.documentElement.clientHeight;//Toman ancho y alto de pantalla
		var h=viewportHeight*0.80, w=viewportWidth*0.65, margin1=30,pomo,cuadro=w/4,duration=1500,delay=1000;
		// en modo diapositivas el gráfico tiene que entrar entero en una pantalla:
		// alto de la ventana menos el menú (60), el buscador y los títulos de los paneles (~150)
		if (window.DIPVIS && window.DIPVIS.diapositivas) h = Math.max(420, viewportHeight - 215);
		var color10=d3.scale.category10();//Paleta categorica de 10 colores
/*
*COMBO BOX
*/
		d3.json("data/combo_nombres.json", function(json) {//trae el json con el listado de nombres con los id correspondientes
				nombres=json;	
				for (i=0;i<nombres.length;i++){
					$('<option/>').val(nombres[i].idip).html(nombres[i].nombre).appendTo('#diputados');
				}
				$(".chzn-select").chosen({no_results_text: "No hay: "});$(".chzn-select-deselect").chosen({allow_single_deselect:true});
		});

		function actualizarFideos() {//Destaca la linea de los diputados seleccionados en el combobox
			var Dips = recuperar_seleccion('diputados');
			d3.selectAll('.posturadip').classed('disabled', true);
			d3.selectAll('.provincia').classed('disabled', true);
			
			if (Dips.length) {
				for (var i = 0; i < Dips.length; i++) {
					d3.select("#" + Dips[i]).classed('disabled', false);
					d3.select("#" + Dips[i]).classed('enabled', true);
					d3.select("#" + Dips[i]).moveToFront();

				};
			} else{
				dips.forEach(
					function(d){
						d3.select("#dip"+d.id).classed('disabled', false);
						d3.selectAll('.provincia').classed('disabled', false);
						d3.select("#dip"+d.id).classed('enabled', false);
					}
				);
			};
		}
		function recuperar_seleccion(id) {//Devuelve array con la seleccion del combobox
			var valores = [];
			var obj = document.getElementById(id);
			for(var i=0; i<obj.length; i++) {
				if (obj[i].selected) {
					valores.push("dip" + obj[i].value);
				}
			}
			return(valores);
		}
/***/

/*
*Curvas de Andrews de las posturas de los diputados
*/
		d3.json("data/fideos_dips2.json", function(json) {//Trae los datos principales
			dips=json.diputados;
			dips.forEach(function(d){(d.points.forEach(function(y){ar.push(y.year)}))});//rango de anios
			dips.forEach(function(d){(d.points.forEach(function(y){idps.push(y.idp)}))});//rango de puntos ideales
			d3.select("#diputados").style("width",(viewportWidth*0.60)+"px");

			var svg=d3.select("#posturas")
 			.style("width",w+"px")
 			.append("svg")
 			.attr("width",w)
 			.attr("height",h);

 			d3.select("#diputados_chzn").style("width",(w)+"px");//igualo ancho del combobox al del panel del grafico

 			var capaRef=svg.append("g").attr("class","ref");
		 	var capa1=svg.append("g").attr("class","fondo1");

		 	var formatYear=d3.time.format("%Y").parse;
			var idpsXscale=d3.time.scale().domain(window.DIPVIS.anios).range([0+margin1,w-margin1]);
			var idpsYscale=d3.scale.linear().domain([d3.min(idps),d3.max(idps)]).range([h-margin1,0+margin1]);
			var color10=d3.scale.category10();
			idps=0;
			ar=0;
			estructura=0;
			var linefunction = d3.svg.line()
				.interpolate("basis")
				.x(function(d) { return idpsXscale(d.year);})
				.y(function(d) { return idpsYscale(d.idp);});

			dips.forEach(
				function(d){//fabricamos una linea por cada diputado, reflejando sus posturas en el tiempo
					var posicion = 'variable';
					if(d.col == '#bbf098'){
						posicion = 'opositora';
					}
					if(d.col == '#6b9eea'){
						posicion = 'oficialista';
					}

					var lineGraph = capa1.append("path")
						.attr("d", linefunction(d.points))
						.attr("class","posturadip " + posicion + " p" + d.distrito)
						.attr("shape-rendering","crispEdges")
						.attr("id",("dip"+d.id))
						.attr("nombre",d.nombre)
						.attr("bloque",d.bloque)
						.attr("foto",d.foto)
						.attr("provincia",d.distrito)
						.on("mouseover", function() {
							selectCurrent(d3.select(this));
							selectCurrent(d3.selectAll("#p"+d3.select(this).attr("provincia")));
							d3.select("#tooltip").select("img").attr("src","");
							d3.select("#tooltip")
								.attr("class","")
								.select("strong")
								.text(d3.select(this).attr("nombre"));
							d3.select("#tooltip")
								.select("bloque")
								.text(d3.select(this).attr("bloque"));
							d3.select("#tooltip")
								.select("img")
								.attr("src",(d3.select(this).attr("foto")));
							
							// barras de la tarjeta: arriba = año del lado de LLA, abajo = del lado opositor, raya chica = ese año sin lado claro
							var css = getComputedStyle(document.documentElement);
							$('#tristate').sparkline(d.estados, {type:'tristate', barWidth:6, zeroAxis:true,
								posBarColor: css.getPropertyValue('--c-of').trim(), negBarColor: css.getPropertyValue('--c-op').trim(), zeroBarColor: '#9a958c'});
						})
						.on("mouseout", function() {
							
							unselectCurrent(d3.select(this));
							unselectCurrent(d3.selectAll("#p"+d3.select(this).attr("provincia")));
							
							d3.select("#tooltip").attr("class","hidden");

						});
				}
			);
			var xAxis=d3.svg.axis().scale(idpsXscale).orient("bottom").tickFormat(d3.format("d"));
			svg.append("g").attr("class","xaxis").attr("transform","translate(0,"+(h-margin1)+")").call(xAxis);

			capa1.append("text")
				.attr("x", (w / 2))
				.attr("y", 20)
				.attr("text-anchor", "middle")
				.style("font-size", "16px")
				.text("Postura de los diputados al votar en la Cámara, 2022 - 2026");
			/*
			* Dibuja flechas del eje y
			*/
				var capaFlechas=svg.append("g").attr("class","flechas");

				capaFlechas.append("marker")
					.attr("id", "triangle-start")
					.attr("viewBox", "0 0 10 10")
					.attr("refX", 10)
					.attr("refY", 5)
					.attr("markerWidth", -6)
					.attr("markerHeight", 6)
					.attr("orient", "auto")
					.append("path")
					.attr("d", "M 0 0 L 10 5 L 0 10 z");

				capaFlechas.append("marker")
					.attr("id", "triangle-end")
					.attr("viewBox", "0 0 10 10")
					.attr("refX", 10)
					.attr("refY", 5)
					.attr("markerWidth", 6)
					.attr("markerHeight", 6)
					.attr("orient", "auto")
					.append("path")
					.attr("d", "M 0 0 L 10 5 L 0 10 z");

				capaFlechas.append("line")
					.attr("class", "arrow")
					.attr("x1", 20)
					.attr("x2", 20)
					.attr("y1", idpsYscale(2.2))
					.attr("y2", idpsYscale(0.02))
					.attr("marker-start", "url(#triangle-start)")
					.style("stroke","black");
				capaFlechas.append("line")
					.attr("class", "arrow")
					.attr("x1", 20)
					.attr("x2", 20)
					.attr("y1", idpsYscale(-2.2))
					.attr("y2", idpsYscale(-0.02))
					.attr("marker-start", "url(#triangle-start)")
					.style("stroke","black");
				capaFlechas.append('text')
					.text('LLA · PRO')
					.attr('y',idpsYscale(2.3))
					.attr('x',20);
				capaFlechas.append('text')
					.text('Peronismo · izquierda')
					.attr('y',idpsYscale(-2.3))
					.attr('x',20);
			/**/
			/*
			* Referencia
			*/
				var ref={"posturas":[{"postura":"siempre opositor","color":"#4f8a8b","yrel":1},{"postura":"cambió de lado","color":"#cf8a1c","yrel":2},{"postura":"siempre del lado de LLA","color":"#6a3fa0","yrel":3}]},sbul=11;
				capaRef.selectAll('rect')
					.data(ref.posturas)
					.enter()
					.append('rect')
					.attr('x',w-(w/5))
					.attr('y',function(d){return h-90+(sbul*d.yrel);})
					.attr('width',sbul-1)
					.attr('height',sbul-1)
					.attr('fill',function(d){return d.color;});
				capaRef.selectAll('text')
					.data(ref.posturas)
					.enter()
					.append('text')
					.text(function(d){return d.postura})
					.attr('x',w-(w/5)+12)
					.attr('y',function(d){return h-82+(sbul*d.yrel);});
			/***/
		});

/* Funcion que permite que un objeto pase al frente de la imagen */
		d3.selection.prototype.moveToFront = function() {//metodo que hace que un objeto pase al frente de la imagen -CREDITO
				return this.each(function() { 
					this.parentNode.appendChild(this); 
				}); 
		};
/***/


		</script>

			<span id="tristate">Loading..</span>
			<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></img><br>

		<script type="text/javascript">
		$(document).ready(function(){//Lleva el tooltip a la posicion cercana al mouse
			$('#posturas').mousemove(function(e){
				// la tarjeta sigue al cursor en todo el gráfico (antes sólo si pageY < 80% del alto de la ventana,
				// y con el encabezado arriba eso dejaba la tarjeta fuera de la vista)
				$("#tooltip").css({top: e.pageY, left: e.pageX+30, position:'absolute'});
				
			});
		});
		d3.select('#combo').style("width",w+"px");


		/*
		*La parte del mapa
		*/
			var mapw=viewportWidth*0.3,maph=h;
			var mapsvg=d3.select("#mapa")//agregamos un svg para contener el mapa
					.style("width",viewportWidth*0.30+"px")
					.style("height",h+"px")
					.style("margin-left","20px")
		 			.append("svg")
		 			.attr("width",mapw)
		 			.attr("height",maph);

		 	var maplayer1=mapsvg.append("g").attr("class","maplayer1");
		 	var maplayer2=mapsvg.append("g").attr("class","maplayer1");
		 	var projection = d3.geo.transverseMercator().center([3, -38]).rotate([66, 0])
		 	.translate([(mapw / 2), (maph / 2)]).scale((maph * 56.5) / 35);
		 	var mappath = d3.geo.path().projection(projection);
		 	var aviso=maplayer1.append('text').text('Cargando mapa...').attr('x',(mapw/2)-80).attr('y',maph/2);
			d3.json("../maps/provincias.json", function(json) {//Provincias excepto T. del Fuego

				maplayer1.selectAll("path")
					.data(json.features)
					.enter()
					.append("path")
					.attr("d", mappath)
					.attr("id",function(d){return "p"+(d.properties.prov);})
					.attr("provname",function(d){return (d.properties.provincia);})
					.attr("class","provincia")
					.on("mouseover", onMouseOver)
					.on("mouseout", onMouseOut)
					.on("click", onClick);
					aviso.text('');
			});

			d3.json("../maps/TIERRA DEL FUEGO.json", function(json) {//Aqui incorporamos T. del Fuego
				maplayer2.selectAll("path")
					.data(json.features)
					.enter()
					.append("path")
					.attr("d", mappath)
					.attr("id",function(d){return "p"+(d.properties.prov);})
					.attr("provname",function(d){return (d.properties.PROVINCIA);})
					.attr("class","provincia")
					.on("mouseover", onMouseOver)
					.on("mouseout", onMouseOut)
					.on("click", onClick);
			});

			function onClick() {
				var prov = d3.select(this).attr("id");
				var provname = d3.select(this).attr("provname");
				// console.log("onclick!!!", prov);
				window.location = 'matrix2.html#' + prov.substring(1) + "#" + provname;
			}

			function onMouseOver() {
				//Pintar provincia de rojo
				var prov = d3.selectAll("#" + d3.select(this).attr("id"));
				selectCurrent(prov);

				//Agregar clase 'current'
				var lines = d3.selectAll("." + d3.select(this).attr("id"));
				selectCurrent(lines);

								
			}

			function onMouseOut() {
				//Volver al color original
				var prov = d3.selectAll("#" + d3.select(this).attr("id"));
				unselectCurrent(prov);

				//Remover classe 'current'
				var lines = d3.selectAll("." + d3.select(this).attr("id"));
				unselectCurrent(lines);				
			}

			function selectCurrent(selection){
				selection.classed('current', true);
				// NO usar moveToFront() aqui: reordenar el nodo bajo el cursor durante el
				// mouseover dispara una cascada de mouseover/mouseout sobre los paths que se
				// solapan, dejando la clase 'current' (rojo) pegada y tragando el click en
				// las provincias. El resaltado en rojo via CSS ya distingue el elemento.
			}

			function unselectCurrent(selection){
				selection.classed('current', false);
			}			
		</script>
